name: CI (De Angelis - Testing)

# ISW2 - Parte De Angelis (Software Testing).
# Valida la test suite com.milestone4 su ogni branch (baseline C0 e varianti C1-C4)
# in un ambiente neutro. Produce coverage (JaCoCo) e mutation (PIT) come artifact.
# Gira su tutti i branch per popolare automaticamente la matrice di validazione.

on:
  push:
  pull_request:
  workflow_dispatch:

# Evita run duplicati sullo stesso branch: annulla i run vecchi.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Gate Pass/Fail: build + test + coverage JaCoCo ---
  test:
    name: Build & Test (JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17: esegue PIT 1.25.9 e JaCoCo 0.8.11; il bytecode resta target 1.8 (vedi pom).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + test (solo com.milestone4) con report JaCoCo
        working-directory: lang/java
        run: mvn -B -ntp -pl avro test

      - name: Upload report JaCoCo (coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ github.ref_name }}
          path: lang/java/avro/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload report Surefire (esiti test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ github.ref_name }}
          path: lang/java/avro/target/surefire-reports/
          if-no-files-found: warn

  # --- Adeguatezza avanzata: mutation testing con PIT ---
  mutation:
    name: Mutation Testing (PIT)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # test-compile popola target/classes e target/test-classes (checkout pulito):
      # senza, PIT trova 0 classi -> "No mutations found".
      - name: PIT mutationCoverage (GenericData + JsonDecoder)
        working-directory: lang/java
        run: mvn -B -ntp -pl avro test-compile -Pmutation org.pitest:pitest-maven:mutationCoverage

      - name: Upload report PIT (mutation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-${{ github.ref_name }}
          path: lang/java/avro/target/pit-reports/
          if-no-files-found: warn
